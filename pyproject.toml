[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrovaris_ai_lib"
version = "0.1.0"
description = "A machine learning library written from scratch, from autograd to a small GPT."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Vitor Rovaris" }]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scikit-learn",
]

[project.optional-dependencies]
torch = ["torch"]
dev = ["pytest", "torch", "scikit-learn", "mlxtend"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
